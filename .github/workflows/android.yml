name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push on the same branch cancels the older, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Tests + export APK + server
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot (templates, Android SDK settings, debug keystore)
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --path game --import 2>&1 | tee import.log

      - name: Compile-check every script (detailed errors)
        shell: bash
        run: |
          set +e +o pipefail
          fail=0
          for f in $(cd game && find scripts -name '*.gd' | sort); do
            out=$(godot --headless --path game --check-only --script "res://$f" 2>&1 | grep -E "SCRIPT ERROR|Parse Error|ERROR: .*res://" -A2 | grep -v "does not inherit from")
            if echo "$out" | grep -q "Parse Error"; then echo "---- $f"; echo "$out"; fail=1; fi
          done
          exit $fail

      - name: Smoke test (menu -> solo game)
        run: |
          godot --headless --path game --fixed-fps 60 --quit-after 600 2>&1 | tee smoke.log
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Invalid (call|access|assignment)" import.log smoke.log; then
            echo "::error::GDScript errors detected"
            exit 1
          fi
          grep -q "SMOKE OK" smoke.log || { echo "::error::Main scene did not run"; exit 1; }

      - name: Input self-test (simulated touch + keyboard)
        run: |
          godot --headless --path game --fixed-fps 60 --quit-after 1800 -- --selftest 2>&1 | tee selftest.log
          if grep -nE "SCRIPT ERROR|Invalid (call|access|assignment)" selftest.log; then exit 1; fi
          grep -q "SELFTEST PASS" selftest.log || { echo "::error::Input self-test failed"; exit 1; }

      - name: Multiplayer test (dedicated server + 2 clients)
        shell: bash
        run: |
          set +e
          godot --headless --path game -- --server --port 7788 > server.log 2>&1 &
          SERVER=$!
          sleep 3
          godot --headless --path game -- --nettest --port 7788 --name Alice > alice.log 2>&1 &
          ALICE=$!
          godot --headless --path game -- --nettest --port 7788 --name Bob > bob.log 2>&1
          BOB_RC=$?
          wait $ALICE; ALICE_RC=$?
          kill $SERVER
          for f in server alice bob; do echo "===== $f"; grep -vE "fontconfig|os_linuxbsd" $f.log; done
          if grep -nE "SCRIPT ERROR|Invalid (call|access|assignment)" server.log alice.log bob.log; then exit 1; fi
          grep -q "NETTEST Alice PASS" alice.log && grep -q "NETTEST Bob PASS" bob.log && [ $ALICE_RC -eq 0 ] && [ $BOB_RC -eq 0 ]

      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --path game --export-debug "Android" "$GITHUB_WORKSPACE/build/android/roobox-debug.apk"
          ls -la build/android
          test -s build/android/roobox-debug.apk

      - name: Export dedicated server (Linux)
        run: |
          mkdir -p build/server
          godot --headless --path game --export-release "Linux Server" "$GITHUB_WORKSPACE/build/server/roobox_server.x86_64"
          ls -la build/server
          test -s build/server/roobox_server.x86_64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roobox-android-debug
          path: build/android/roobox-debug.apk
          if-no-files-found: error

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: roobox-server-linux
          path: build/server/roobox_server.x86_64
          if-no-files-found: error

  backend:
    name: Backend test (real Nakama + Postgres)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Nakama + Postgres
        run: |
          cd backend
          docker compose up -d postgres nakama
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:7350/healthcheck > /dev/null; then echo "nakama is up"; break; fi
            sleep 2
          done
          docker compose ps

      - name: Godot client vs real backend
        run: |
          docker run --rm --network host -v "$PWD:/w" -w /w barichello/godot-ci:4.7.2 bash -c \
            'godot --headless --path game --import > /dev/null 2>&1; godot --headless --path game -- --backendtest --backend http://127.0.0.1:7350' 2>&1 \
            | grep -vE "fontconfig|os_linuxbsd" | tee backend.log
          grep -q "BACKENDTEST PASS" backend.log

      - name: Nakama logs
        if: always()
        run: cd backend && docker compose logs nakama | tail -80

  publish:
    name: Publish dev-latest release (direct APK link)
    needs: [build, backend]
    concurrency:
      group: publish-dev-latest
      cancel-in-progress: false
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: roobox-android-debug
          path: apk

      - name: Download server
        uses: actions/download-artifact@v4
        with:
          name: roobox-server-linux
          path: server

      - name: Replace dev-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev-latest --cleanup-tag -y || true
          gh release create dev-latest apk/roobox-debug.apk server/roobox_server.x86_64 \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Roobox dev build #${{ github.run_number }}" \
            --notes "Debug APK from branch \`${{ github.ref_name }}\` (commit ${{ github.sha }}). Install on Android: download, open, allow 'Install unknown apps'. Dedicated server: roobox_server.x86_64 (Linux x86_64, UDP 7777)."

  server-image:
    name: Publish server Docker image (ghcr.io)
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download server
        uses: actions/download-artifact@v4
        with:
          name: roobox-server-linux
          path: server

      - name: Build and push image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-server
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" server
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          echo "Pushed $IMAGE:latest"
