# Plazo backend: Nakama (accounts, friends, storage, leaderboards) + Postgres
# + the Plazo dedicated game server.
#
#   cp .env.example .env    # then edit the passwords!
#   docker compose --profile game up -d
#
# Ports: 7350/tcp (Nakama API, used by the app), 7777-7780/udp (one game server per game).
# The Nakama admin console (7351) is bound to localhost only; reach it with
# an SSH tunnel:  ssh -L 7351:127.0.0.1:7351 user@your-server
name: plazo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 30

  nakama:
    image: heroiclabs/nakama:3.42.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/sh -ecx
    command: >-
      "/nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama &&
      exec /nakama/nakama --name plazo1
      --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama
      --runtime.path /nakama/data/modules
      --runtime.env GAME_SERVERS=${GAME_SERVERS:-island=:7777,lava_rising=:7778,color_drop=:7779,obby_rush=:7780}
      --runtime.env ADMIN_USERS=${ADMIN_USERS:-}
      --runtime.env JOIN_SECRET=${JOIN_SECRET:-}
      --runtime.http_key ${NAKAMA_HTTP_KEY:-defaulthttpkey}
      --socket.server_key ${NAKAMA_SERVER_KEY:-defaultkey}
      --console.username ${NAKAMA_CONSOLE_USER:-admin}
      --console.password ${NAKAMA_CONSOLE_PASSWORD:-change-me-now}
      --session.token_expiry_sec 86400
      --socket.max_request_size_bytes 4194304
      --logger.level INFO"
    volumes:
      - ./modules:/nakama/data/modules:ro
    ports:
      - "7350:7350"
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One dedicated server per game (experience). Start with: --profile game
  game-island:
    image: ghcr.io/hishamnasrallah/plazo-server:latest
    profiles: ["game"]
    restart: unless-stopped
    environment:
      PLAZO_JOIN_SECRET: ${JOIN_SECRET:-}
      PLAZO_BACKEND_URL: http://nakama:7350
      PLAZO_HTTP_KEY: ${NAKAMA_HTTP_KEY:-defaulthttpkey}
    command: ["--port", "7777", "--experience", "island"]
    ports: ["7777:7777/udp"]

  game-lava:
    image: ghcr.io/hishamnasrallah/plazo-server:latest
    profiles: ["game"]
    restart: unless-stopped
    environment:
      PLAZO_JOIN_SECRET: ${JOIN_SECRET:-}
      PLAZO_BACKEND_URL: http://nakama:7350
      PLAZO_HTTP_KEY: ${NAKAMA_HTTP_KEY:-defaulthttpkey}
    command: ["--port", "7778", "--experience", "lava_rising"]
    ports: ["7778:7778/udp"]

  game-color:
    image: ghcr.io/hishamnasrallah/plazo-server:latest
    profiles: ["game"]
    restart: unless-stopped
    environment:
      PLAZO_JOIN_SECRET: ${JOIN_SECRET:-}
      PLAZO_BACKEND_URL: http://nakama:7350
      PLAZO_HTTP_KEY: ${NAKAMA_HTTP_KEY:-defaulthttpkey}
    command: ["--port", "7779", "--experience", "color_drop"]
    ports: ["7779:7779/udp"]

  game-rush:
    image: ghcr.io/hishamnasrallah/plazo-server:latest
    profiles: ["game"]
    restart: unless-stopped
    environment:
      PLAZO_JOIN_SECRET: ${JOIN_SECRET:-}
      PLAZO_BACKEND_URL: http://nakama:7350
      PLAZO_HTTP_KEY: ${NAKAMA_HTTP_KEY:-defaulthttpkey}
    command: ["--port", "7780", "--experience", "obby_rush"]
    ports: ["7780:7780/udp"]

volumes:
  db:
